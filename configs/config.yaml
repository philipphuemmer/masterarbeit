project:
  name: "Wartungsoptimierung E-Ladesäulen Würzburg"
  seed: 42

rolling_horizon:
  # false → exakt dasselbe Verhalten wie bisher (MaintenanceSimulator, kein RH)
  # true  → RollingHorizonRunner aktiv: Drop-Entscheidungen bei Störungen werden
  #          über einen kurzen Horizont bewertet und ggf. von der Basis-Policy überschrieben.
  enabled: false

  # Anzahl Tage, über die jeder Drop-Kandidat simuliert wird
  horizon_days: 21

  # Anzahl stochastischer Szenarien pro Kandidat (Erwartungswert-Approximation)
  n_scenarios: 25

  # Top-k Routine-Stops die als alternative Drop-Kandidaten bewertet werden
  # (nach aufsteigendem drop_score der Basis-Policy)
  top_k_candidates: 3

  # RH bei Störungs-Drop-Entscheidungen: top_k_candidates Routine-Stops
  # werden per Horizont-Rollout verglichen; bester Drop gewinnt.
  enable_replan: true

  # RH bei Initialplanung: Seed-Rollout pro Team innerhalb fixer Startzone.
  # top_k_initial Seed-Blöcke (Größe initial_seed_block_size) werden bewertet.
  enable_initial: false

  # Anzahl Seed-Kandidaten pro Team bei Initial-RH (Kandidat 0 = Basis-Policy)
  top_k_initial: 3

  # Größe des Seed-Blocks: 1 = einzelne Startstation, 2 = Zweier-Block
  initial_seed_block_size: 1

  # Bei Überschreitung des Zeitbudgets: Fallback auf Basis-Policy-Entscheidung
  fallback_to_legacy_on_timeout: true

  # Maximale Bewertungszeit pro Störungsereignis in Sekunden
  time_budget_sec: 100.0

  # Post-Decision-Rollout:
  #   false (Standard) → bisheriges Verhalten: _build_candidate_state approximiert End-of-Day,
  #                       Rollout startet ab dem nächsten Tag.
  #   true             → echtes Post-Decision: Aktion deterministisch anwenden (Drop+Insert),
  #                       dann verbleibende Stunden des heutigen Tags mit Basis-Policy simulieren,
  #                       danach H-1 Tage Rollout. Sofortkosten (Downtime-Wartezeit) explizit getrennt.
  use_post_decision_rollout: true

  # Kandidaten-Auswahlmodus bei Drop-Entscheidungen:
  #   "expected_value" → Kandidat mit niedrigstem Erwartungswert (bisheriges Verhalten)
  #   "win_rate"       → Kandidat muss Basisaktion in ≥ win_rate_threshold Szenarien schlagen;
  #                       kein Wechsel wenn kein Kandidat die Schwelle erfüllt
  candidate_selection_mode: "win_rate"

  # Mindest-Gewinnquote für win_rate-Modus (0.0–1.0)
  win_rate_threshold: 0.7

solver:
  # true  → OR-Tools für Initialplan und Replan (bisheriges Verhalten aller Modelle)
  # false → Greedy Routing (kein OR-Tools):
  #   Initialplan  CFA:        Greedy nach C̃(k)/dist(aktuelle Position, k)
  #   Initialplan  MyopicPlus: Greedy Nearest-Neighbor nach 1/dist(aktuelle Position, k)
  #   Replan beide: Cheapest-Insertion + modellspezifischer Drop (C̃ bzw. power×hours×p)
  use_or_tools: false

data:
  raw_path: "data/raw/charging_stations_wue.csv"
  processed_path: "data/processed/stations_clean.csv"
  distance_matrix_path: "data/distance_matrices/travel_times.npy"
  separator: ";"
  # Coordinate columns in the CSV
  lat_col: "Breitengrad"
  lon_col: "Laengengrad"
  id_col: "Ladeeinrichtungs-ID"

google_maps:
  # Überschrieben durch .env / GOOGLE_MAPS_API_KEY
  # travel_mode: driving | walking | bicycling | transit
  travel_mode: "driving"
  # units: metric | imperial
  units: "metric"
  # Max. Elemente pro API-Call (rows * cols <= 100 im Free Tier)
  max_elements_per_request: 100

osrm:
  # URL der lokalen OSRM Docker-Instanz
  base_url: "http://localhost:5000"
  # HTTP-Timeout in Sekunden (397×397 braucht ~5–15s)
  timeout: 120
  # OSM-Daten für OSRM Preprocessing (relativ zum Projektordner)
  osm_pbf: "data/osrm/bayern.osm.pbf"
  osrm_processed: "data/osrm/bayern.osrm"

depot:
  # WVV Betriebshof Sanderau, Friedrich-Spee-Straße 58-64, 97072 Würzburg
  name: "WVV Betriebshof Sanderau"
  # 49.776414
  lat: 49.7817
  # 9.938582
  lon: 9.9351

planning:
  # K-Means Clustering (reines K-Means, kein Balance-Zwang) Normal: 60
  n_zones: 120
  # Tägliche Zonenauswahl
  n_top_candidates: 20       # Aus allen offenen Zonen: Top-N nach Prioritätsscore für Startzone
  min_team_separation_km: 0.0  # Mindestabstand zwischen Team-Zonen
  max_stations_per_team: 20  # Max. Routine-Kandidaten pro Team; OR-Tools löst innerhalb Zeitfenster
  travel_reserve_min: 20     # Zeitpuffer für An-/Abfahrt zum Depot [min]
  # Zonenauswahlmodus:
  #   "classic"        → depot_distance + convex_hull_area
  #   "centrality"     → Zonen mit geringster mittlerer Distanz zu anderen Zonen zuerst
  #   "depot_distance" → nur mittlere Depot-Entfernung (nächste Zonen zuerst)
  #   "value_based"    → modellspezifische Wertfunktion (CFA/VFA/...)
  zone_selection_mode: "value_based"
  # Team-Zuweisung im Initialplan: true → OR-Tools darf nur dem zugewiesenen Team fahren
  # (verhindert geografisch unpassende Zuordnungen, kann aber Infeasibility erzwingen).
  # false → OR-Tools verteilt Tasks frei über beide Teams.
  use_team_assignment: true
  priority_weights:
    depot_distance: 0.5      # Gewicht für mittlere Depot-Entfernung (nur classic)
    convex_hull_area: 0.5    # Gewicht für Zonengröße (nur classic)
    zone_value: 0.5          # Gewicht für V̂-Zonenwert (nur value_based)

environment:
  # Wie viele Ladesäulen maximal in einer Episode besucht werden
  max_stations_per_episode: 30
  # Maximale Schritte pro Episode
  max_steps: 50
  # Reward-Shaping-Parameter (werden später kalibriert)
  reward:
    visit_bonus: 10.0          # Belohnung für eine besuchte Station
    travel_time_penalty: 0.1   # Strafe pro Minute Fahrzeit
    revisit_penalty: -5.0      # Strafe für doppelten Besuch
    completion_bonus: 50.0     # Bonus für Abschluss aller Aufgaben

stochastic_travel_times:
  # false → bisheriges Verhalten: Fahrtzeiten deterministisch aus Stundenmatrix
  # true  → Fahrtzeiten je Abschnitt als Lognormal(mean=m_ij,h, cv=cv_h) gesampelt;
  #          nur in der Simulation aktiv, Planer bleibt deterministisch.
  enabled: true

  # Variationskoeffizient cv = σ/μ je Arbeitsstunde.
  # Kleiner Wert = geringe Streuung (ruhiger Verkehr), großer Wert = hohe Streuung.
  # Startparametrisierung: Morgen/Nachmittag höher (Rush hour), Mittag niedriger.
  cv_by_hour:
    8:  0.20
    9:  0.18
    10: 0.10
    11: 0.10
    12: 0.10
    13: 0.10
    14: 0.10
    15: 0.15
    16: 0.15

  # Anzahl Monte-Carlo-Läufe pro Teamroute und Tag für die KPI-Berechnung.
  n_mc_runs: 200

  # Service-Level-Schwelle α: P(Endzeit ≤ Arbeitszeitende) ≥ α
  # Wird aktuell nur für KPI-Reporting genutzt (keine aktive Routenablehnung).
  feasibility_alpha: 0.95

failure_simulation:
  # "csv"       → Störungen aus data/malfunction.csv laden (bisheriges Verhalten)
  # "stochastic" → Störungen stündlich probabilistisch generieren
  mode: "stochastic"

  # Basiswahrscheinlichkeit pro Säule und Stunde (kalibriert auf 3 Typ-1 / 1 Typ-2 pro Tag
  # bei 397 Säulen und 9 Arbeitsstunden):
  #   Typ 1: 3 / (397 * 9) ≈ 0.00084
  #   Typ 2: 1 / (397 * 9) ≈ 0.00028
  #   Typ 1: 5 / (397 * 9) ≈ 0.00130            1,5 Erhöhung: 0.00195
  #   Typ 2: 2 / (397 * 9) ≈ 0.00056            1,5 Erhöhung: 0.00084
  p1_per_hour: 0.00150
  p2_per_hour: 0.00075

  # Erholungskurve nach Wartung: p(t) = p_base * (initial_factor + (1 - initial_factor) * t / recovery_days)
  recovery_days: 365      # Tage bis zur vollständigen Erholung auf 100 %
  initial_factor: 0.1     # Wahrscheinlichkeitsfaktor direkt nach Wartung (10 %)
  randomize_initial_dsm: false  # true → jede Station startet mit Uniform(0, recovery_days) dsm (fixer Seed → gleich für alle Runs)

cfa:
  # Erwartete Ausfallkosten als Zusatzterm in der VRP-Zielfunktion:
  # penalty(k) = alpha × p_h × t_exp_h × power_kW × downtime_eur_per_kwh / wage_eur_per_min
  # Nur Routine-Tasks, nur im Initialplan (Replan läuft ohne Penalty).
  alpha: 10.0                # Skalierungsfaktor (10 → ~23 min für 300 kW am Tagesende)

vfa:
  # Hybrid-VFA: Score = α × L(k) + β × ΔV̂_global(k)
  # L(k)          = θ_local^T × φ_scaled_local(k)   (aus cfa_future θ)
  # ΔV̂_global(k) = V̂(s) − V̂(s ohne k)             (aus train_vfa.py θ)
  alpha: 1.0                 # Gewicht lokaler CFA-Future-Term
  beta:  1.0                 # Gewicht globaler Zustandswert-Term

maintenance:
  # Failure-Wahrscheinlichkeit pro Zeitschritt (wird später durch Daten kalibriert)
  failure_rate: 0.02
  # Wartungszeit pro Station:
  #   "fixed"                → mean_service_time für alle Stationen gleich
  #   "per_charging_point"   → Anzahl Ladepunkte × minutes_per_charging_point
  service_time_mode: "fixed"
  minutes_per_charging_point: 15
  # Mittlere Wartungszeit in Minuten (nur aktiv wenn service_time_mode: "fixed")
  mean_service_time: 45
  # Anzahl Wartungsteams
  n_teams: 2
  # Arbeitstag: 8:00–17:00 Uhr
  workday_start_hour: 8
  workday_end_hour: 16
  # Gewichtungsfaktor für Makespan-Term in der Zielfunktion.
  # 0 = nur Gesamtfahrzeit minimieren, >0 = Lastverteilung erzwingen.
  # Kalibrieren nach ersten Tests mit echten Daten.
  global_span_cost_coefficient: 0
  # Mittagspause: Dauer und frühester Startzeitpunkt (Minuten ab 08:00).
  # 0 = keine Pause. VRP-Horizont wird automatisch um lunch_duration_min verkürzt.
  lunch_duration_min: 0
  lunch_earliest_min: 240   # = 12:00 Uhr
  # OR-Tools Abbruchkriterium: "time" (Zeitlimit) oder "solution" (Lösungsanzahl).
  # "solution" ist maschinenunabhängig reproduzierbar bei gleichem Seed.
  solver_limit_mode: "solution"
  # Zeitlimit in Sekunden (aktiv wenn solver_limit_mode: "time")
  solver_time_limit_initial: 2
  solver_time_limit_replan: 2
  # Lösungsanzahl (aktiv wenn solver_limit_mode: "solution")
  solver_solution_limit_initial: 100
  solver_solution_limit_replan: 50
